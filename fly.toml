# fly.toml app configuration file generated for picframes-server on 2026-06-27T21:09:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'picframes-server'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[env]
  PORT = "8080"
  SHARE_DIR = "/data/share"
  CONFIG_DIR = "/data/config"
  FIRMWARE_DIR = "/app/firmware"

[mounts]
  source = "picframes_data"
  destination = "/data"

