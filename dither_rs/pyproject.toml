[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dither-rs"
version = "0.1.0"
requires-python = ">=3.11"
description = "Fast Floyd-Steinberg dithering for picframes (Rust extension)"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "dither_rs"
