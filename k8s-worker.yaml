---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picframes-redis
  namespace: memories
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picframes-redis
  template:
    metadata:
      labels:
        app: picframes-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: picframes-redis
  namespace: memories
spec:
  selector:
    app: picframes-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picframes-worker
  namespace: memories
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picframes-worker
  template:
    metadata:
      labels:
        app: picframes-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/finn-e/picframes:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=1"]
        env:
        - name: REDIS_URL
          value: redis://picframes-redis:6379/0
        - name: SHARE_DIR
          value: /share
        - name: CONFIG_DIR
          value: /config
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: picframes-secrets
              key: secret-key
        volumeMounts:
        - name: nfs-share
          mountPath: /share
        - name: config-volume
          mountPath: /config
      volumes:
      - name: nfs-share
        nfs:
          server: dahole.treee.house
          path: /frame-800x480-6colour
      - name: config-volume
        persistentVolumeClaim:
          claimName: picframes-config-pvc
