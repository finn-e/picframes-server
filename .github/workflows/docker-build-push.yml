name: Test, Build and Push Docker Image

on:
  push:
    branches:
      - trunk

permissions:
  contents: write   # build job pushes the release tag (v<version>)
  packages: write

jobs:
  # ------------------------------------------------------------------
  # Tests gate the image build: any pytest failure blocks the release.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest maturin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install dither_rs extension
        run: cd dither_rs && maturin develop --release
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Run pytest
        run: pytest -v

  # ------------------------------------------------------------------
  # Version is derived from Conventional Commits since the last v* tag
  # (paulhatch/semantic-version). The computed version is:
  #   - the GHCR image tag (plain semver, e.g. 0.21.1 — the same format
  #     keel already watches; keel.sh/policy "all" deploys any new tag)
  #   - injected into the app via the SERVER_VERSION_OVERRIDE build arg
  #     (app.py falls back to its hardcoded SERVER_VERSION otherwise)
  #   - pushed back as annotated git tag v<version> so the NEXT build
  #     computes relative to this release (paulhatch only bumps ONE
  #     step past the most recent tag, no matter how many commits).
  # NOTE: requires a baseline tag v0.21.0 on the 0.21.0 release commit;
  # with no v* tag at all the computed version collapses to 0.1.0.
  # ------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    # The forgejo.treee.house mirror also receives pushes; its runner can't
    # reach GHCR / GHA cache, so this job only runs on github.com.
    if: github.server_url == 'https://github.com'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # full history + tags required by semantic-version

      - name: Compute semantic version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/(^[a-zA-Z]+(\\([^)]*\\))?!:|BREAKING CHANGE)/"
          minor_pattern: "/^feat(\\([^)]*\\))?:/"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SERVER_VERSION_OVERRIDE=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/finn-e/picframes:latest
            ghcr.io/finn-e/picframes:${{ steps.version.outputs.version }}
            ghcr.io/finn-e/picframes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release commit
        # Skip when the tag already exists (build re-run, or a chore-only push
        # that computes the same version as the previous release).
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists; skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
          fi
