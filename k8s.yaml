apiVersion: apps/v1
kind: Deployment
metadata:
  name: picframes
  namespace: memories
  labels:
    app: picframes
  annotations:
    keel.sh/policy: all
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picframes
  template:
    metadata:
      labels:
        app: picframes
    spec:
      containers:
      - name: server
        image: ghcr.io/finn-e/picframes:0.11.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: picframes-secrets
              key: secret-key
              optional: false
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: picframes-secrets
              key: admin-password
              optional: false
        - name: SHARE_DIR
          value: "/share"
        - name: CONFIG_DIR
          value: "/config"
        - name: REDIS_URL
          value: "redis://picframes-redis:6379/0"
        volumeMounts:
        - name: nfs-share
          mountPath: /share
        - name: config-volume
          mountPath: /config
      volumes:
      - name: nfs-share
        nfs:
          server: dahole.treee.house
          path: /frame-800x480-6colour
      - name: config-volume
        persistentVolumeClaim:
          claimName: picframes-config-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: picframes-config-pvc
  namespace: memories
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: picframes
  namespace: memories
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: picframes
